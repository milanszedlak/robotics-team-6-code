# Arm task parameters (★ = check against your own robot; see the README)
# The fixed camera pose is NOT here; it is in config/camera_pose.yaml
arm_task:
  ros__parameters:
    # ---------- Robot / gripper ----------
    base_frame: base_link
    ik_link: link6_flange            # ★ gripper link: origin at the centre of the joint-6 flange face
    tcp_frame: gripper_tcp           # gripper-centre TF published by this node (visible in RViz)
    tcp_offset: 0.10                 # ★ distance from the flange-face centre to the point between the fingers, along gripper forward [m]
    planning_group: arm              # ★
    arm_joints:                      # ★ ros2 topic echo /joint_states --once
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5
      - link5_to_link6
      - link6_to_link6_flange
    approach_axis: "+z"              # ★ axis of ik_link pointing out of the gripper
    closing_axis: "+y"               # ★ axis the fingers would close along at joint-6 zero if there were no offset
    gripper_roll_offset_deg: 45.0    # ★ gripper mounting offset: at joint-6 zero the fingers are tilted 45° (seen from the front)
                                     #   positive = counter-clockwise; if it is actually tilted clockwise, use -45.0
    wrist_joint: ""                  # joint-6 name; empty = last entry of arm_joints
    wrist_limits_deg: [-175.0, 175.0]  # joint-6 range; must not exceed the driver's clamp (±175°)
    home_joints:    [0.0, 0.5, -1.8, 0.0, 0.0, 0.0]      # ★ waiting / detection pose: the arm must NOT block the camera
    carry_joints:   [0.0, 0.0, -1.0, -0.5, 0.0, 0.0]     # ★ pose while holding a block and waiting for the vehicle
    place_joints:   [1.2, -0.3, -1.2, -0.05, 0.0, 0.0]   # ★ pose for dropping the block into the basket

    # ---------- Controllers / IK ----------
    arm_action: /arm_controller/follow_joint_trajectory
    ik_solver: internal              # internal = built-in myCobot 280 kinematics (real robot, no MoveIt)
                                     # moveit   = MoveIt /compute_ik (set automatically in Gazebo simulation)
    ik_service: /compute_ik          # moveit only
    ik_timeout: 0.2
    ik_avoid_collisions: false
    max_joint_speed: 0.6
    min_segment_time: 0.4

    # ---------- Gripper ----------
    gripper_mode: action             # action = GripperCommand; trajectory = JointTrajectoryController
    gripper_action: /gripper_action_controller/gripper_cmd
    gripper_trajectory_action: /gripper_controller/follow_joint_trajectory
    gripper_joint: gripper_controller          # ★
    gripper_open_position: 0.0                 # ★
    gripper_closed_position: -0.7              # ★
    gripper_max_effort: 10.0
    gripper_max_opening: 0.045                 # ★ maximum opening [m]
    grasp_check_tolerance: 0.03

    # ---------- Vision interface (agreed with the vision side) ----------
    vision_topic: /vision/blocks
    camera_frame: camera_color_optical_frame   # frame of the vision messages (used when frame_id is empty)
    min_confidence: 0.5
    settle_time: 0.6                 # after the arm stops at home, only accept images captured this much later [s]
    vision_timeout: 5.0
    track_max_jump: 0.03             # when averaging frames, a block farther than this from the first frame is a different block [m]
    accept_unstamped: false          # testing only: true = accept fake blocks sent with `ros2 topic pub` (timestamp 0)

    # ---------- Grasp strategy ----------
    approach_height: 0.08            # height of the gripper centre above the grasp point before descending [m]
    grasp_depth: 0.012               # how far below the block's top face the grasp point is [m]
    lift_height: 0.08
    min_grasp_z: 0.005               # minimum grasp point height (base frame), to avoid hitting the table
    descend_step: 0.02               # segment length for the straight-line descent [m]
    detect_samples: 3                # number of frames to average
    detect_retries: 5

    # ---------- Mode / vehicle hand-off ----------
    autorun: false                   # false = wait for commands (/arm/locate_blocks, /arm/pick_block, /arm/place_block)
                                     # true  = run the pick → vehicle → place loop on its own (commands rejected)
    wait_for_vehicle: true           # false = place immediately after picking (for testing the arm alone)
    vehicle_timeout: 300.0           # max seconds to wait for the vehicle; 0 = wait forever
    loop: true                       # after one block, look for the next

# Vision node on the real robot (RealSense D435 on the laptop / NUC)
block_vision:
  ros__parameters:
    colors: [red, blue, green]
    grasp_colors: [red, blue, green]
    gripper_max_opening: 0.045
    min_area: 300.0                  # [pixel^2] smaller blobs are ignored (noise)
    min_fill_ratio: 0.75             # blob area / rotated-rectangle area; low = not a box
    depth_min: 0.15                  # [m] D435 cannot measure closer than about 0.1-0.2 m
    depth_max: 1.5
    process_rate: 10.0               # [Hz] max detection rate (0 = every frame)
    # HSV ranges [h,s,v low, h,s,v high (, second range)]; OpenCV H is 0-180. Tune under your lighting
    # while watching /vision/debug_image (rqt_image_view).
    hsv.red: [0, 120, 70, 10, 255, 255, 170, 120, 70, 180, 255, 255]
    hsv.blue: [100, 120, 50, 130, 255, 255]
    hsv.green: [40, 80, 50, 85, 255, 255]

# The two nodes below are only used in simulation
sim_vision:
  ros__parameters:
    colors: [red, blue, green]
    grasp_colors: [red, blue, green]
    gripper_max_opening: 0.045
    min_area: 300.0

fake_vehicle:
  ros__parameters:
    travel_time: 3.0
